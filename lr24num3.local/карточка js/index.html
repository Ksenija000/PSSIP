
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="form-container">
        <h1>Задать вопрос</h1>

        <form id="feedbackForm">
        
                <input type="text" id="name" name="name" required placeholder="Ваше имя:" minlength="2" pattern="[A-Za-zА-Яа-яЁё\s]+">
               
                <input id="email" name="email" required placeholder="E-mail:">
             
                <input type="tel" id="phone" name="phone" required placeholder="Телефон*:">
           
                <textarea id="question" name="question" required placeholder="Вопрос:"></textarea>
          

            <button type="submit">Отправить</button>
            </form>
            </div>
            
            <div class="output-section" id="outputSection" style="display: none;">
                <h2>Полученные данные:</h2>
                <div id="formDataOutput"></div>
            
                <h2>Данные из cookie:</h2>
                <div id="cookieDataOutput"></div>
            
                <h2>Данные в JSON формате:</h2>
                <div id="jsonOutput"></div>
            
                <button id="clearCookiesBtn" style="margin-top: 20px; background-color: #f44336;">Очистить cookie</button>
            </div>
           
            <script src="js/script.js"></script>
    </body>
    
    </html>
