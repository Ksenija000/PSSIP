<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дом лучшей еды</title>
    <link rel="icon" href="image/LOGO.png">
    <link rel="stylesheet" href="Home-best-food\лр19-20\css\style.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="container1">
            <a href="index.html" class="header_logo">
                <img src="image/LOGO.png" alt="LOGO" title="логотип" class="img_hov">
            </a>
            <h1 class="txtik2">Дом лучшей еды</h1>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <section class="catalog">
                <h2>Наш каталог</h2>
                <div class="product-grid" id="productGrid">
                    <!-- Товары будут загружены через JavaScript -->
                </div>

            <aside class="cart">
                <h2>Корзина</h2>
                <div id="cartItems">
                    <!-- Элементы корзины будут загружены через JavaScript -->
                </div>
                <div class="cart-total" id="cartTotal">
                    Итого: 0 Br
                </div>
                <button class="checkout-btn" id="checkoutBtn">Оформить заказ</button>
            </aside>
        </div>
    </div>

    <script src="js/script.js"></script>
