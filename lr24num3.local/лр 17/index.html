<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body * {
            margin: 10px;
            border: 1px solid blue;
        }
    </style>
</head>

<body>
    <!-- Использование атрибута HTML --> <input value="Нажми меня" onclick="alert('Клик!')" type="button">
    <br>
    <!-- ИСПОЛЬЗОВАНИЕ ФУНКЦИИ --> <input type="button" onclick="countRabbits()" value="Считать кроликов!">
    <br>
    <!--Использование свойства DOM-объекта--><input id="elem" type="button" value="Нажми меня!">
    <br>
    <!--Доступ к элементу через this--><button onclick="alert(this.innerHTML)">Нажми меня</button>
    <br>
    <!--Метод addEventListener--><input id="elem1" type="button" value="Нажми меня">
    <br>
    <!--Всплытие-->
    <form onclick="alert('form')">FORM
        <div onclick="alert('div')">DIV
            <p onclick="alert('p')">P</p>
        </div>
    </form>
    <br>

    <div onclick="alert(`сюда всплытие не дойдёт`)">
        <!--Прекращение всплытия-->
        <button onclick="event.stopPropagation()">Кликни меня</button>
    </div>
</body>
<script>
    function countRabbits() {
        for (let i = 1; i <= 3; i++) {
            alert("Кролик номер " + i);
        }
    }
</script>
<script>
    elem.onclick = function () {
        alert('Спасибо');
    };
</script>
<script>
    function handler1() {
        alert("Спасибо!");
    };
    function handler2() {
        alert("Спасибо ещё раз!");
    }
    elem1.onclick = () => alert("Привет");
    elem1.addEventListener("click", handler1); // Спасибо!
    elem1.addEventListener("click", handler2); // Спасибо ещё раз!
    elem1.removeEventListener("click", handler1);//Для удаления обработчика следует использовать removeEventListener 
</script>

</html>
