<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>


<body>
    <!-- 1 События мыши.   --> <button id="bt">Нажми Alt+Shift+Click на мне!</button>
     <br>
    <!-- 2 События клавиатуры.   --><h2>События клавиатуры</h2>
    <input type="text" id="keyboardInput" placeholder="Нажмите клавиши..." />
    <br>
    <!-- 3 Drag&DROP события   -->
    <h2>Drag & Drop события</h2>
    <div id="draggable" draggable="true">Перетащите меня!</div>
    <div id="dropzone">Сбросьте сюда</div>
    <!-- 4 События указателя   -->
    <h2>События указателя</h2>
    <div id="pointerEvents">
        Указатель событий здесь
    </div>
<!-- 5 События полосы прокрутки   -->
<h2>События полосы прокрутки</h2>
<div id="pll" >
    <div id="pokruti">Прокрутите меня!</div>
</div>
<!-- 6 События сенсорных экранов -->
<h2>События сенсорных экранов</h2>
<div id="touchEvents">
    Коснитесь здесь (на сенсорном экране)
</div>
<!-- 6 События, связанные с таймером -->
<h2>События, связанные с таймером</h2>
<button id="startTimer">Запустить таймер</button>
<div id="timerOutput">Таймер не запущен</div>

    <script src="js/script.js"></script>
</body>
</html>
